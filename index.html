<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>FarmDirect B2B – Map Marketplace</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Transparent top search bar -->
  <header class="top-bar">
    <a class="logo" href="/">FarmDirect</a>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search-input" type="search" placeholder="Search products, categories, locations…" aria-label="Search listings" />
    </div>
    <div class="header-actions">
      <button id="filter-btn" class="icon-btn" aria-label="Filters" aria-expanded="false" title="Filters">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      </button>
      <button id="options-btn" class="icon-btn" aria-label="Options" aria-haspopup="true" aria-expanded="false" title="Options">⋮</button>
      <button id="profile-btn" class="icon-btn" aria-label="Profile" title="Profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <button id="theme-btn" class="icon-btn" aria-label="Toggle theme" aria-pressed="false" title="Theme">☀</button>
    </div>
  </header>

  <div class="main">
    <div id="map" role="application" aria-label="Listings map"></div>

    <!-- Side list panel -->
    <aside class="sidebar" aria-label="Listings list">
      <div class="sidebar-header">
        <h2>Listings <span id="data-status" class="count"></span></h2>
        <span id="list-count" class="count"></span>
      </div>
      <div id="listing-list" class="listing-list" role="list">
        <div class="loading-state">Loading…</div>
      </div>
    </aside>
  </div>

  <!-- Filter card -->
  <div id="filter-card" class="filter-card" role="dialog" aria-label="Filters" aria-modal="false">
    <h3>Filters</h3>
    <div class="filter-group">
      <label for="filter-category">Category</label>
      <select id="filter-category">
        <option value="">All</option>
        <option value="produce">Produce</option>
        <option value="dairy">Dairy</option>
        <option value="eggs">Eggs</option>
        <option value="grains">Grains</option>
        <option value="herbs">Herbs</option>
        <option value="honey">Honey</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-visibility">Visibility</label>
      <select id="filter-visibility">
        <option value="">Any</option>
        <option value="worldwide">Worldwide</option>
        <option value="country">Country</option>
        <option value="province">Province</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-maxprice">Max price</label>
      <input id="filter-maxprice" type="number" min="0" step="0.01" placeholder="No limit" />
    </div>
    <button id="clear-filters" class="clear-filters">Clear filters</button>
  </div>

  <!-- Options menu -->
  <div id="options-menu" class="options-menu" role="menu" aria-label="Options">
    <button role="menuitem" onclick="document.getElementById('theme-btn').click(); this.closest('.options-menu').classList.remove('open');">Toggle theme</button>
    <button role="menuitem" onclick="alert('About FarmDirect B2B – map-first agricultural marketplace.'); this.closest('.options-menu').classList.remove('open');">About</button>
    <button role="menuitem" onclick="alert('Deploy status: Worker not yet deployed. See README for wrangler commands.'); this.closest('.options-menu').classList.remove('open');">Deploy status</button>
  </div>

  <!-- Product detail card -->
  <div id="product-card" class="detail-card" role="dialog" aria-label="Product details" aria-modal="false"></div>

  <!-- Seller profile card -->
  <div id="seller-card" class="seller-card-overlay" role="dialog" aria-label="Seller profile" aria-modal="false"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/list.js"></script>
  <script src="js/main.js"></script>
  <script src="cleanup.js"></script>
  <script src="listings-api.js"></script>
</body>
</html>
