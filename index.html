<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>FarmDirect B2B – Map Marketplace</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Transparent top search bar -->
  <header class="top-bar">
    <a class="logo" href="/">FarmDirect</a>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search-input" type="search" placeholder="Search products, categories, locations…" aria-label="Search listings" />
    </div>
    <div class="header-actions">
      <button id="locate-btn" class="icon-btn" aria-label="Locate me" title="Locate me">⌖</button>
      <button id="fit-all-btn" class="icon-btn" aria-label="Fit all listings" title="Fit all listings">⤢</button>
      <button id="add-listing-btn" class="icon-btn" aria-label="Add listing" title="Add listing">+</button>
      <button id="filter-btn" class="icon-btn" aria-label="Filters" aria-expanded="false" title="Filters">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      </button>
      <button id="options-btn" class="icon-btn" aria-label="Options" aria-haspopup="true" aria-expanded="false" title="Options">⋮</button>
      <button id="profile-btn" class="icon-btn" aria-label="Profile / seller dashboard" title="Profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <button id="theme-btn" class="icon-btn" aria-label="Toggle theme" aria-pressed="false" title="Theme">☀</button>
    </div>
  </header>

  <!-- Seed/demo-mode banner (shown when Worker is undeployed) -->
  <div id="seed-banner" class="seed-banner hidden" role="status" aria-live="polite">
    <span>Demo mode: showing seed data. Deploy the Worker (see README – P1) for live D1 listings and create/edit/delete.</span>
    <button id="close-seed-banner" class="close-banner" aria-label="Dismiss demo notice">×</button>
  </div>

  <div class="main">
    <div id="map" role="application" aria-label="Listings map">
      <div id="map-overlay" class="map-overlay">
        <div class="overlay-content">
          <div class="spinner" aria-hidden="true"></div>
          <div>Loading listings…</div>
        </div>
      </div>
    </div>

    <!-- Side list panel -->
    <aside class="sidebar" aria-label="Listings list">
      <div class="sidebar-header">
        <h2>Listings <span id="data-status" class="count"></span></h2>
        <span id="list-count" class="count"></span>
      </div>
      <div id="listing-list" class="listing-list" role="list">
        <!-- Skeletons shown while loading -->
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
      </div>
    </aside>
  </div>

  <!-- Filter card -->
  <div id="filter-card" class="filter-card" role="dialog" aria-label="Filters" aria-modal="false">
    <h3>Filters</h3>
    <div class="filter-group">
      <label for="filter-category">Category</label>
      <select id="filter-category">
        <option value="">All</option>
        <option value="produce">Produce</option>
        <option value="dairy">Dairy</option>
        <option value="eggs">Eggs</option>
        <option value="grains">Grains</option>
        <option value="herbs">Herbs</option>
        <option value="honey">Honey</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-visibility">Visibility</label>
      <select id="filter-visibility">
        <option value="">Any</option>
        <option value="worldwide">Worldwide</option>
        <option value="country">Country</option>
        <option value="province">Province</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-maxprice">Max price</label>
      <input id="filter-maxprice" type="number" min="0" step="0.01" placeholder="No limit" />
    </div>
    <button id="clear-filters" class="clear-filters">Clear filters</button>
  </div>

  <!-- Options menu -->
  <div id="options-menu" class="options-menu" role="menu" aria-label="Options">
    <button id="opt-theme" role="menuitem">Toggle theme</button>
    <button id="opt-set-api" role="menuitem">Set API base…</button>
    <button id="opt-clear-api" role="menuitem">Clear API base (use seed/demo)</button>
    <button id="opt-reset-demo" role="menuitem">Reset demo listings</button>
    <button id="opt-deploy-status" role="menuitem">Deploy status</button>
    <button id="opt-about" role="menuitem">About</button>
  </div>

  <!-- Product detail card -->
  <div id="product-card" class="detail-card" role="dialog" aria-label="Product details" aria-modal="false"></div>

  <!-- Seller profile card -->
  <div id="seller-card" class="seller-card-overlay" role="dialog" aria-label="Seller profile" aria-modal="false"></div>

  <!-- Add / edit listing form modal -->
  <div id="listing-form-modal" class="form-modal" role="dialog" aria-label="Listing form" aria-modal="true">
    <div class="form-modal-content">
      <button id="close-form-btn" class="close-btn" aria-label="Close">×</button>
      <h3 id="form-title">Add listing</h3>
      <form id="listing-form">
        <div class="form-row">
          <label>Latitude <input id="form-lat" name="lat" type="number" step="any" required placeholder="39.7392" /></label>
          <label>Longitude <input id="form-long" name="long" type="number" step="any" required placeholder="-104.9903" /></label>
          <button type="button" id="use-location-btn" class="small-btn">Use my location</button>
        </div>
        <label>Visibility
          <select name="visibility" required>
            <option value="worldwide">Worldwide</option>
            <option value="country">Country</option>
            <option value="province" selected>Province</option>
          </select>
        </label>
        <label>Address <input name="address" type="text" required placeholder="123 Farm Rd, Denver, CO" /></label>
        <label>Seller ID <input id="form-sellerid" name="sellerid" type="text" required placeholder="seller-demo" /></label>
        <label>Category <input name="category" type="text" required placeholder="produce" /></label>
        <label>Header description <input name="headerdescription" type="text" required maxlength="120" placeholder="Fresh organic tomatoes" /></label>
        <div class="form-row">
          <label>Price <input name="price" type="number" min="0" step="0.01" required placeholder="2.50" /></label>
          <label>Units <input name="units" type="text" required placeholder="lb" /></label>
        </div>
        <label>Description <textarea name="description" rows="2" placeholder="Optional longer description"></textarea></label>
        <label>Image
          <input id="image-file" type="file" accept="image/*" />
          <img id="image-preview" class="image-preview" alt="Preview" />
          <input name="image" type="url" placeholder="or paste image URL (https://…)" />
        </label>
        <div id="form-status" class="form-status" role="status"></div>
        <button type="submit" class="primary-btn">Create listing</button>
      </form>
    </div>
  </div>

  <!-- Seller dashboard modal (P4 starter) -->
  <div id="dashboard-modal" class="form-modal" role="dialog" aria-label="Seller dashboard" aria-modal="true">
    <div class="form-modal-content">
      <button id="close-dashboard-btn" class="close-btn" aria-label="Close">×</button>
      <div id="dashboard-content"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/list.js"></script>
  <script src="js/form.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
