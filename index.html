<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmDirect B2B – Map-first Marketplace</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="top-bar">
    <a href="/" class="logo">FarmDirect</a>
    <div class="search-box">
      <input id="search-input" type="search" placeholder="Search products, sellers, locations…" aria-label="Search listings" autocomplete="off">
      <button id="clear-search" class="clear-search" hidden aria-label="Clear search">×</button>
      <div id="search-suggestions" class="search-suggestions" hidden role="listbox"></div>
    </div>
    <div class="header-actions">
      <button id="locate-btn" class="icon-btn" title="Locate me">📍</button>
      <button id="clear-location-btn" class="icon-btn" title="Clear location" hidden>✕</button>
      <button id="fit-btn" class="icon-btn" title="Fit all listings">🗺️</button>
      <button id="fullscreen-btn" class="icon-btn" title="Fullscreen map">⛶</button>
      <button id="filter-btn" class="icon-btn" title="Filters">⚙️</button>
      <button id="options-btn" class="icon-btn" title="Options" aria-haspopup="true" aria-expanded="false">☰</button>
      <button id="profile-btn" class="icon-btn" title="Profile / Dashboard">👤<span id="rfq-badge" class="badge" hidden></span></button>
    </div>
  </header>
  <div id="seed-banner" class="seed-banner hidden">
    <span>Demo mode – using local seed data. Deploy the Worker to go live.</span>
    <button id="deploy-guide-btn" class="link-btn">Show deploy steps</button>
    <button id="close-banner" class="close-banner" aria-label="Dismiss">×</button>
  </div>
  <div class="main">
    <div id="map"></div>
    <div id="map-overlay" class="map-overlay"><div class="overlay-content"><div class="spinner"></div>Loading listings…</div></div>
    <aside class="sidebar">
      <div class="sidebar-header"><h2>Listings</h2><span id="list-count" class="count">0</span></div>
      <div id="filter-chips" class="filter-chips"></div>
      <div id="listing-list" class="listing-list" role="list"></div>
    </aside>
  </div>

  <!-- Filter card -->
  <div id="filter-card" class="filter-card">
    <div class="filter-group"><label for="filter-category">Category</label><select id="filter-category"><option value="">All</option></select></div>
    <div class="filter-group"><label for="filter-visibility">Visibility</label><select id="filter-visibility"><option value="">All</option><option value="worldwide">Worldwide</option><option value="country">Country</option><option value="province">Province</option></select></div>
    <div class="filter-group"><label for="filter-seller">Seller</label><input id="filter-seller" type="text" placeholder="Seller ID"></div>
    <div class="filter-group"><label>Price</label><div class="form-row"><input id="filter-price-min" type="number" placeholder="Min"><input id="filter-price-max" type="number" placeholder="Max"></div></div>
    <button id="clear-filters" class="clear-filters">Clear filters</button>
  </div>

  <!-- Options menu -->
  <div id="options-menu" class="options-menu">
    <button id="theme-btn">Toggle theme</button>
    <button id="stats-btn">Listing statistics</button>
    <button id="sellers-btn">Seller directory</button>
    <button id="recent-btn">Recently viewed</button>
    <button id="compare-btn">Compare listings</button>
    <button id="my-rfqs-btn">My quote requests</button>
    <button id="export-filtered-btn">Export filtered (JSON)</button>
    <button id="copy-view-link-btn">Copy view link</button>
    <button id="copy-map-link-btn">Copy map view link</button>
    <button id="clear-favorites-btn">Clear favorites</button>
    <button id="export-demo-btn">Export demo data</button>
    <button id="import-demo-btn">Import demo data</button>
    <button id="reset-demo-btn">Reset demo data</button>
    <button id="set-api-btn">Set API base</button>
    <button id="clear-api-btn">Clear API base</button>
    <button id="deploy-modal-btn">Show deploy commands</button>
  </div>

  <!-- Compare modal -->
  <div id="compare-modal" class="form-modal">
    <div class="form-modal-content" style="width:min(900px,96vw)">
      <button id="close-compare-btn" class="close-btn" aria-label="Close">×</button>
      <h3>Compare listings</h3>
      <div id="compare-content"></div>
    </div>
  </div>

  <!-- Deploy guide modal (skeleton) -->
  <div id="deploy-modal" class="form-modal">
    <div class="form-modal-content">
      <button id="close-deploy-btn" class="close-btn" aria-label="Close">×</button>
      <h3>Deploy the Worker</h3>
      <pre id="deploy-commands">npx wrangler login
npx wrangler d1 execute b2bistening --remote --file=./schema/d1-schema.sql
npx wrangler deploy</pre>
      <button id="copy-deploy-btn" class="primary-btn">Copy commands</button>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <div id="image-lightbox" class="image-lightbox"><img id="lightbox-img" alt=""></div>

  <!-- Leaflet + cluster -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- App modules (order matters) -->
  <script src="js/config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/list.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/form.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/rfq.js"></script>
  <script src="js/recent.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/sellers.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/search.js"></script>
  <script src="js/fullscreen.js"></script>
  <script src="js/geojson.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
