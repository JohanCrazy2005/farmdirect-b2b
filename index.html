<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmDirect B2B – Map-first Marketplace</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Full original UI restored + Compare -->
  <header class="top-bar">
    <a href="/" class="logo">FarmDirect</a>
    <div class="search-box">
      <input id="search-input" type="search" placeholder="Search products, sellers, locations…" aria-label="Search listings" autocomplete="off">
      <button id="clear-search" class="clear-search" hidden aria-label="Clear search">×</button>
      <div id="search-suggestions" class="search-suggestions" hidden role="listbox"></div>
    </div>
    <div class="header-actions">
      <button id="locate-btn" class="icon-btn" title="Locate me">📍</button>
      <button id="clear-location-btn" class="icon-btn" title="Clear location" hidden>✕</button>
      <button id="fit-btn" class="icon-btn" title="Fit all listings">🗺️</button>
      <button id="fullscreen-btn" class="icon-btn" title="Fullscreen map">⛶</button>
      <button id="filter-btn" class="icon-btn" title="Filters">⚙️</button>
      <button id="options-btn" class="icon-btn" title="Options">☰</button>
      <button id="profile-btn" class="icon-btn" title="Profile / Dashboard">👤<span id="rfq-badge" class="badge" hidden></span></button>
    </div>
  </header>
  <div id="seed-banner" class="seed-banner hidden">
    <span>Demo mode – using local seed data. Deploy the Worker to go live.</span>
    <button id="deploy-guide-btn" class="link-btn">Show deploy steps</button>
    <button id="close-banner" class="close-banner" aria-label="Dismiss">×</button>
  </div>
  <div class="main">
    <div id="map"></div>
    <aside class="sidebar">
      <div class="sidebar-header"><h2>Listings</h2><span id="list-count" class="count">0</span></div>
      <div id="filter-chips" class="filter-chips"></div>
      <div id="listing-list" class="listing-list" role="list"></div>
    </aside>
  </div>
  <div id="options-menu" class="options-menu">
    <button id="compare-btn">Compare listings</button>
    <button id="deploy-modal-btn">Show deploy commands</button>
  </div>
  <div id="compare-modal" class="form-modal">
    <div class="form-modal-content" style="width:min(900px,96vw)">
      <button id="close-compare-btn" class="close-btn" aria-label="Close">×</button>
      <h3>Compare listings</h3>
      <div id="compare-content"></div>
    </div>
  </div>
  <script src="js/compare.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
